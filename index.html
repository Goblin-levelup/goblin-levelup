<script>
  // 1. 初始化狀態（包含任務跨日重置記錄）
  let state = {
    lv: 1, exp: 0, str: 5, int: 5, wil: 5, vit: 5,
    nopmoDays: 0, consecutiveRelaxCount: 0, lastCheckIn: null,
    bossSinIndex: 0, bossPhase: 1, bossHp: 200, bossMaxHp: 200, bossKills: 0,
    completedTasks: [], lastTaskResetDate: null
  };

  // 2. 七大罪 Boss 列表
  const sinBosses = [
    {
      sin: "怠惰",
      phases: [
        { name: "蛇王森 (Phase 1)", avatar: "🦥", desc: "拖延症大魔王，陷喺梳化入面令你提唔起勁。", hp: 200, atk: 2 },
        { name: "床褥沼澤 (Phase 2)", avatar: "🛋️", desc: "將你深深吸入床褥，意志開始瓦解！", hp: 800, atk: 5 },
        { name: "拖延黑洞 (Phase 3)", avatar: "🕳️", desc: "將所有自律計劃拖延至明日的黑洞！", hp: 2500, atk: 12 },
        { name: "時間蒸發者 (Phase 4)", avatar: "⏳", desc: "偷走你所有光陰與青春的無形大魔王！", hp: 8000, atk: 25 },
        { name: "廢人氣場 (Phase 5)", avatar: "🌫️", desc: "散發讓全周圍失去所有動力與熱情的氣場！", hp: 25000, atk: 60 },
        { name: "萬劫石化尊 (Phase 6)", avatar: "🗿", desc: "讓身體與心靈完全石化沉淪的半神心魔！", hp: 80000, atk: 150 },
        { name: "終極虛無怠惰神 (Phase 7)", avatar: "👾", desc: "怠惰之極致！終極神魔！", hp: 250000, atk: 400 }
      ]
    }
  ];

  // 3. 每日任務列表
  const tasks = [
    { id: 1, category: "身體", stat: "str", val: 1, text: "早起唔賴床 (08:00 前)", exp: 5 },
    { id: 2, category: "身體", stat: "str", val: 2, text: "飲足 2000ml 水", exp: 10 },
    { id: 3, category: "身體", stat: "str", val: 4, text: "做運動 / 健身 20 分鐘", exp: 20 },
    { id: 4, category: "精神", stat: "int", val: 1, text: "睇書 / 學習新知識 15 分鐘", exp: 5 },
    { id: 5, category: "精神", stat: "int", val: 2, text: "戒糖 / 今日唔飲手搖飲品", exp: 10 },
    { id: 6, category: "精神", stat: "int", val: 4, text: "檢視與記錄今日花費開支", exp: 20 },
    { id: 7, category: "心理", stat: "wil", val: 2, text: "清理房間 / 整理書桌環境", exp: 10 },
    { id: 8, category: "心理", stat: "wil", val: 1, text: "實施 15 分鐘冥想或拉筋放鬆", exp: 5 },
    { id: 9, category: "心理", stat: "wil", val: 4, text: "今晚 11:30 前熄燈安穩入睡", exp: 20 }
  ];

  // 稱號與進化路線判定
  function getRouteType() {
    if (state.str >= state.int && state.str >= state.wil) return 1;
    if (state.int >= state.str && state.int >= state.wil) return 2;
    if (state.wil >= state.str && state.wil >= state.int) return 3;
    return 4;
  }

  function getGoblinRank(level) {
    if (level <= 10) return '油頭KAM撚哥布林';
    if (level <= 30) return '油頭毒撚哥布林';
    if (level <= 70) return '毒撚哥布林';

    const route = getRouteType();

    if (level <= 150) {
      if (route === 1) return '新手gym撚哥布林';
      if (route === 2) return '偽毒哥布林';
      if (route === 3) return '偽文青哥布林';
      return '潛力股哥布林';
    }
    if (level <= 300) {
      if (route === 1) return '初段鐵血修羅哥布林';
      if (route === 2) return '初段精緻隱世哥布林';
      if (route === 3) return '初段浮生哲思哥布林';
      return '初段全能潛龍哥布林';
    }
    if (level <= 500) {
      if (route === 1) return '中段巨獸領域哥布林';
      if (route === 2) return '中段次元影匿大師';
      if (route === 3) return '中段文藝文心大師';
      return '中段全能六邊形戰士';
    }
    if (level <= 750) {
      if (route === 1) return '高段肉身成聖破壁者';
      if (route === 2) return '高段無相幻影破壁者';
      if (route === 3) return '高段心靈知性破壁者';
      return '高段全知全能破壁者';
    }
    if (level <= 997) {
      if (route === 1) return '終段力之本源半神尊者';
      if (route === 2) return '終段虛妄迷宮半神尊者';
      if (route === 3) return '終段真理彼岸半神尊者';
      return '終段萬物歸一半神尊者';
    }
    if (level === 998) return '人間自律極致';
    return '宇宙無敵 終極自律神';
  }

  function getGoblinImage(rank) {
    return rank + '.png';
  }

  // 跨日任務重置邏輯
  function checkDailyReset() {
    let today = new Date().toDateString();
    if (state.lastTaskResetDate !== today) {
      state.completedTasks = [];
      state.lastTaskResetDate = today;
    }
  }

  function loadGame() {
    const saved = localStorage.getItem('goblin_save_v20');
    if (saved) {
      try { state = Object.assign(state, JSON.parse(saved)); } catch(e) {}
    }
    checkDailyReset();
    updateUI();
  }

  function saveGame() {
    localStorage.setItem('goblin_save_v20', JSON.stringify(state));
  }

  // 升級經驗需求計算（平滑化）
  function getMaxExp(level) {
    if (level <= 70) return Math.floor(10 * level + 1.5 * Math.pow(level, 2));
    return Math.floor(50 * level + 5 * Math.pow(level, 2));
  }

  // 戒色安全倍率計算（最高 5x）
  function getNoPmoMultiplier(days) {
    if (days <= 0) return 1.0;
    return Math.min(5.0, 1.0 + (days - 1) * 0.2);
  }

  function getCurrentBoss() {
    let sin = sinBosses[state.bossSinIndex % sinBosses.length];
    let phaseIndex = (state.bossPhase - 1) % sin.phases.length;
    return sin.phases[phaseIndex];
  }

  function renderTasks() {
    const container = document.getElementById('taskContainer');
    if (!container) return;
    container.innerHTML = '';
    
    let categories = ["身體", "精神", "心理"];
    categories.forEach(cat => {
      let catTasks = tasks.filter(t => t.category === cat);
      if (catTasks.length === 0) return;

      let titleDiv = document.createElement('div');
      titleDiv.className = 'category-title';
      titleDiv.innerText = cat;
      container.appendChild(titleDiv);

      let ul = document.createElement('ul');
      ul.className = 'task-list';

      catTasks.forEach(task => {
        let isDone = state.completedTasks && state.completedTasks.includes(task.id);
        let statLabel = task.stat === 'str' ? `+${task.val}體能` : (task.stat === 'int' ? `+${task.val}智力` : (task.stat === 'wil' ? `+${task.val}意志` : `+${task.val}活力`));
        let li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
          <span style="${isDone ? 'text-decoration: line-through; color: var(--text-muted);' : ''}">
            ${task.text} <small style="color: var(--accent-gold);">(+${task.exp} EXP) (${statLabel})</small>
          </span>
          <div>
            ${!isDone 
              ? `<button class="btn btn-green" onclick="completeTask(${task.id})">搞掂</button>`
              : `<span style="color: var(--accent-green);">已完成</span>`
            }
          </div>
        `;
        ul.appendChild(li);
      });
      container.appendChild(ul);
    });
  }

  function updateUI() {
    document.getElementById('goblinLv').innerText = state.lv;
    const currentRank = getGoblinRank(state.lv);
    document.getElementById('goblinRank').innerText = currentRank;
    document.getElementById('currentExp').innerText = state.exp.toLocaleString();
    const maxExp = getMaxExp(state.lv);
    document.getElementById('maxExp').innerText = maxExp.toLocaleString();
    document.getElementById('expBar').style.width = Math.min((state.exp / maxExp) * 100, 100) + '%';

    document.getElementById('statStr').innerText = state.str;
    document.getElementById('statInt').innerText = state.int;
    document.getElementById('statWil').innerText = state.wil;
    document.getElementById('statVit').innerText = state.vit;

    // 頭像切換防爆機制（避免缺少 img 標籤時報錯）
    const imgElement = document.getElementById('goblinImg');
    if (imgElement) {
      const targetSrc = getGoblinImage(currentRank);
      if (imgElement.getAttribute('src') !== targetSrc) {
        imgElement.setAttribute('src', targetSrc);
      }
    }

    // 更新戒色倍率與顯示
    const multiplier = getNoPmoMultiplier(state.nopmoDays);
    document.getElementById('nopmoDays').innerText = state.nopmoDays;
    document.getElementById('nopmoMultiplier').innerText = multiplier.toFixed(1) + 'x';

    renderTasks();

    // 更新 Boss 面板
    const curBoss = getCurrentBoss();
    document.getElementById('bossAvatar').innerText = curBoss.avatar;
    document.getElementById('bossName').innerText = curBoss.name;
    document.getElementById('bossDesc').innerText = curBoss.desc;
    document.getElementById('bossPhaseTag').innerText = `Phase ${state.bossPhase} / 7`;
    document.getElementById('bossHp').innerText = state.bossHp.toLocaleString();
    document.getElementById('bossMaxHp').innerText = state.bossMaxHp.toLocaleString();
    document.getElementById('bossHpBar').style.width = Math.max(0, (state.bossHp / state.bossMaxHp * 100)) + '%';
  }

  // 經驗值增加與防負數機制
  function addExp(amount) {
    state.exp += amount;
    if (state.exp < 0) state.exp = 0; // 防止經驗值變負數

    while(state.exp >= getMaxExp(state.lv)) {
      state.exp -= getMaxExp(state.lv);
      state.lv++;
      state.str += 2; state.int += 2; state.wil += 2; state.vit += 2;
      alert(`哥布林突破升呢去到 Lv.${state.lv}！全屬性大提升！`);
    }
    saveGame();
    updateUI();
  }

  function completeTask(id) {
    let task = tasks.find(t => t.id === id);
    if (task && (!state.completedTasks || !state.completedTasks.includes(id))) {
      if (!state.completedTasks) state.completedTasks = [];
      state.completedTasks.push(id);
      if(task.stat === 'str') state.str += task.val;
      if(task.stat === 'int') state.int += task.val;
      if(task.stat === 'wil') state.wil += task.val;
      if(task.stat === 'vit') state.vit += task.val;
      addExp(task.exp);
    }
  }

  function checkInNoPMO() {
    let today = new Date().toDateString();
    if(state.lastCheckIn === today) {
      return alert('今日已經簽過到啦！');
    }
    state.nopmoDays++;
    state.consecutiveRelaxCount = 0;
    state.lastCheckIn = today;
    state.wil += 3; state.vit += 3;
    const multiplier = getNoPmoMultiplier(state.nopmoDays);
    const rewardExp = Math.floor(10 * multiplier);
    addExp(rewardExp);
    alert(`戒色簽到成功！連續 ${state.nopmoDays} 日！獲得 EXP +${rewardExp.toLocaleString()}！`);
  }

  function medicalRelax() {
    if(!confirm('確定今日生理調節？（注意：連續兩日放鬆會導致天數歸零並扣除 50 EXP）')) {
      return;
    }
    state.consecutiveRelaxCount++;
    if(state.consecutiveRelaxCount >= 2) {
      state.nopmoDays = 0; 
      state.consecutiveRelaxCount = 0;
      addExp(-50);
      alert(`連續兩日放鬆！戒色天數歸零，扣除 50 EXP！`);
    } else {
      addExp(-5);
      alert(`生理調節完成！EXP -5`);
    }
    saveGame(); 
    updateUI();
  }

  function relapseNoPMO() {
    if(confirm('真係要重置天數？清空連續日數並扣除 100 EXP！')) {
      state.nopmoDays = 0; 
      state.consecutiveRelaxCount = 0;
      addExp(-100);
      alert('戒色天數歸零！');
    }
  }

  function attackBoss() {
    let damage = (state.str + state.wil) * 10;
    state.bossHp -= damage;
    if(state.bossHp <= 0) {
      state.bossHp = 0;
      state.bossKills = (state.bossKills || 0) + 1;
      let expReward = 1000 * state.bossPhase * (state.bossSinIndex + 1);
      if(state.bossPhase < 7) {
        alert(`成功擊破心魔！進入 Phase ${state.bossPhase + 1} 狂暴型態！`);
        state.bossPhase++;
      } else {
        alert(`徹底淨化七大罪心魔終極形態！`);
        state.bossSinIndex++;
        state.bossPhase = 1;
      }
      addExp(expReward);
      const cur = getCurrentBoss();
      state.bossMaxHp = cur.hp;
      state.bossHp = state.bossMaxHp;
    } else {
      let cur = getCurrentBoss();
      state.vit = Math.max(0, state.vit - cur.atk);
      alert(`造成 ${damage.toLocaleString()} 點自律傷害！\nBoss 反擊！活力 (VIT) 減少了 ${cur.atk} 點！`);
      if(state.vit === 0) {
        addExp(-50);
        state.vit = 5;
        alert(`活力歸零陷入氣絕狀態！扣除 50 EXP！`);
      }
    }
    saveGame(); 
    updateUI();
  }

  loadGame();
</script>
