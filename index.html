<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我要成為LV999哥布林</title>
  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: #1a1d2d;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --accent-gold: #f1c40f;
      --accent-purple: #9b59b6;
      --accent-blue: #3498db;
      --text-light: #ecf0f1;
      --text-muted: #8e9aaf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 15px; }
    header { text-align: center; padding: 12px; background: var(--card-bg); border-radius: 12px; border: 1px solid #2d3248; }
    header h1 { color: var(--accent-green); font-size: 1.8rem; }
    .card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid #2d3248; }
    .goblin-status { display: flex; align-items: center; gap: 15px; }
    .status-info { flex: 1; }
    .level-badge { display: inline-block; background: var(--accent-purple); padding: 3px 10px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; color: #fff; margin-bottom: 4px; }
    .exp-bar-container { background: #0f111a; height: 14px; border-radius: 7px; overflow: hidden; margin: 6px 0; border: 1px solid #3a3f58; }
    .exp-bar { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); width: 0%; transition: width 0.3s ease; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; text-align: center; }
    .stat-item { background: #25293c; padding: 6px; border-radius: 6px; }
    .stat-item label { font-size: 0.75rem; color: var(--text-muted); display: block; }
    .stat-item span { font-size: 1rem; font-weight: bold; color: var(--accent-gold); }
    .category-title { font-size: 1rem; color: var(--accent-gold); margin: 12px 0 8px 0; border-bottom: 1px solid #2d3248; padding-bottom: 4px; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: #25293c; padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-green { background: var(--accent-green); color: #fff; }
    .btn-red { background: var(--accent-red); color: #fff; }
    .btn-blue { background: var(--accent-blue); color: #fff; }
    .nopmo-card { border: 1px solid var(--accent-purple); background: linear-gradient(135deg, #1a1d2d, #251b34); }
    .nopmo-flex { display: flex; justify-content: space-between; align-items: center; }
    .streak-count { font-size: 2rem; font-weight: bold; color: var(--accent-gold); }
    .boss-card { text-align: center; border: 1px solid var(--accent-red); background: linear-gradient(180deg, #1a1d2d, #2d151c); }
    .boss-avatar { font-size: 3.5rem; margin: 8px 0; }
    .boss-phase-badge { background: var(--accent-red); color: #fff; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }
    .hp-bar-container { background: #0f111a; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0; border: 1px solid #3a3f58; }
    .hp-bar { height: 100%; background: var(--accent-red); width: 100%; transition: width 0.3s ease; }
  </style>
</head>

  <header>

  </header>

        <div class="stat-item"><label>活力 (VIT)</label><span id="statVit">5</span></div>
      </div>
    </div>
  </div>

  <!-- 戒色修煉面板 -->

    <div class="nopmo-flex">
      <div>
        <div class="streak-count"><span id="nopmoDays">0</span> <small style="font-size: 0.9rem; color: #fff;">日</small></div>

      <div style="display: flex; flex-direction: column; gap: 6px;">

    </div>
  </div>

  <!-- 任務面板 -->
  <div class="card">
    <h3 style="margin-bottom: 5px; font-size: 1rem;">每日自律任務</h3>
    <div id="taskContainer"></div>
  </div>

  <!-- Boss 地下城面板 -->
  <div class="card boss-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="color: var(--accent-red); font-size: 1rem;">心魔 Boss 地下城</h3>

    </div>
    <div class="boss-avatar" id="bossAvatar">🛋️</div>

    <p style="font-size: 0.75rem; color: var(--accent-gold); margin-bottom: 6px;" id="bossDesc">拖延症大魔王，陷喺梳化入面令你提唔起勁。</p>
    <div class="hp-bar-container"><div class="hp-bar" id="bossHpBar"></div></div>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">
      Boss HP: <span id="bossHp">200</span> / <span id="bossMaxHp">200</span>
    </p>
    <button class="btn btn-red" onclick="attackBoss()">發動普通自律攻擊</button>
  </div>
</div>

  function getRouteType() {
    if (state.str >= state.int && state.str >= state.wil) return 1;
    if (state.int >= state.str && state.int >= state.wil) return 2;
    if (state.wil >= state.str && state.wil >= state.int) return 3;
    return 4;
  }

  function getGoblinRank(level) {
    if (level <= 10) return '油頭KAM撚哥布林';
    if (level <= 30) return '油頭毒撚哥布林';
    if (level <= 70) return '毒撚哥布林';

    const route = getRouteType();

    if (level <= 150) {
      if (route === 1) return '新手gym撚哥布林';
      if (route === 2) return '偽毒哥布林';
      if (route === 3) return '偽文青哥布林';
      return '潛力股哥布林';
    }
    if (level <= 300) {
      if (route === 1) return '初段鐵血修羅哥布林';
      if (route === 2) return '初段精緻隱世哥布林';
      if (route === 3) return '初段浮生哲思哥布林';
      return '初段全能潛龍哥布林';
    }
    if (level <= 500) {
      if (route === 1) return '中段巨獸領域哥布林';
      if (route === 2) return '中段次元影匿大師';
      if (route === 3) return '中段文藝文心大師';
      return '中段全能六邊形戰士';
    }
    if (level <= 750) {
      if (route === 1) return '高段肉身成聖破壁者';
      if (route === 2) return '高段無相幻影破壁者';
      if (route === 3) return '高段心靈知性破壁者';
      return '高段全知全能破壁者';
    }
    if (level <= 997) {
      if (route === 1) return '終段力之本源半神尊者';
      if (route === 2) return '終段虛妄迷宮半神尊者';
      if (route === 3) return '終段真理彼岸半神尊者';
      return '終段萬物歸一半神尊者';
    }
    if (level === 998) return '人間自律極致';
    return '宇宙無敵 終極自律神';
  }

  function getGoblinImage(rank) {
    return rank + '.png';
  }

  function checkDailyReset() {
    let today = new Date().toDateString();
    if (state.lastTaskResetDate !== today) {
      state.completedTasks = [];
      state.lastTaskResetDate = today;
    }
  }

  function loadGame() {
    const saved = localStorage.getItem('goblin_save_v20');
    if (saved) {
      try { state = Object.assign(state, JSON.parse(saved)); } catch(e) {}
    }
    checkDailyReset();
    updateUI();
  }

  function saveGame() {
    localStorage.setItem('goblin_save_v20', JSON.stringify(state));
  }

  function getMaxExp(level) {
    if (level <= 70) return Math.floor(10 * level + 1.5 * Math.pow(level, 2));
    return Math.floor(50 * level + 5 * Math.pow(level, 2));
  }

  function getNoPmoMultiplier(days) {
    if (days <= 0) return 1.0;
    return Math.min(5.0, 1.0 + (days - 1) * 0.2);
  }

  function getCurrentBoss() {
    let sin = sinBosses[state.bossSinIndex % sinBosses.length];
    let phaseIndex = (state.bossPhase - 1) % sin.phases.length;
    return sin.phases[phaseIndex];
  }

  function renderTasks() {
    const container = document.getElementById('taskContainer');
    if (!container) return;
    container.innerHTML = '';
    
    let categories = ["身體", "精神", "心理"];
    categories.forEach(cat => {
      let catTasks = tasks.filter(t => t.category === cat);
      if (catTasks.length === 0) return;

      let titleDiv = document.createElement('div');
      titleDiv.className = 'category-title';
      titleDiv.innerText = cat;
      container.appendChild(titleDiv);

      let ul = document.createElement('ul');
      ul.className = 'task-list';

      catTasks.forEach(task => {
        let isDone = state.completedTasks && state.completedTasks.includes(task.id);
        let statLabel = task.stat === 'str' ? `+${task.val}體能` : (task.stat === 'int' ? `+${task.val}智力` : (task.stat === 'wil' ? `+${task.val}意志` : `+${task.val}活力`));
        let li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
          <span style="${isDone ? 'text-decoration: line-through; color: var(--text-muted);' : ''}">
            ${task.text} <small style="color: var(--accent-gold);">(+${task.exp} EXP) (${statLabel})</small>
          </span>
          <div>
            ${!isDone 
              ? `<button class="btn btn-green" onclick="completeTask(${task.id})">搞掂</button>`
              : `<span style="color: var(--accent-green);">已完成</span>`
            }
          </div>
        `;
        ul.appendChild(li);
      });
      container.appendChild(ul);
    });
  }

  function updateUI() {
    document.getElementById('goblinLv').innerText = state.lv;
    const currentRank = getGoblinRank(state.lv);
    document.getElementById('goblinRank').innerText = currentRank;
    document.getElementById('currentExp').innerText = state.exp.toLocaleString();
    const maxExp = getMaxExp(state.lv);
    document.getElementById('maxExp').innerText = maxExp.toLocaleString();
    document.getElementById('expBar').style.width = Math.min((state.exp / maxExp) * 100, 100) + '%';

    document.getElementById('statStr').innerText = state.str;
    document.getElementById('statInt').innerText = state.int;
    document.getElementById('statWil').innerText = state.wil;
    document.getElementById('statVit').innerText = state.vit;

    const imgElement = document.getElementById('goblinImg');
    if (imgElement) {
      const targetSrc = getGoblinImage(currentRank);
      if (imgElement.getAttribute('src') !== targetSrc) {
        imgElement.setAttribute('src', targetSrc);
      }
    }

    const multiplier = getNoPmoMultiplier(state.nopmoDays);
    document.getElementById('nopmoDays').innerText = state.nopmoDays;
    document.getElementById('nopmoMultiplier').innerText = multiplier.toFixed(1) + 'x';

    renderTasks();

    const curBoss = getCurrentBoss();
    document.getElementById('bossAvatar').innerText = curBoss.avatar;
    document.getElementById('bossName').innerText = curBoss.name;
    document.getElementById('bossDesc').innerText = curBoss.desc;
    document.getElementById('bossPhaseTag').innerText = `Phase ${state.bossPhase} / 7`;
    document.getElementById('bossHp').innerText = state.bossHp.toLocaleString();
    document.getElementById('bossMaxHp').innerText = state.bossMaxHp.toLocaleString();
    document.getElementById('bossHpBar').style.width = Math.max(0, (state.bossHp / state.bossMaxHp * 100)) + '%';
  }

  function addExp(amount) {
    state.exp += amount;
    if (state.exp < 0) state.exp = 0;

    while(state.exp >= getMaxExp(state.lv)) {
      state.exp -= getMaxExp(state.lv);
      state.lv++;
      state.str += 2; state.int += 2; state.wil += 2; state.vit += 2;
      alert(`哥布林突破升呢去到 Lv.${state.lv}！全屬性大提升！`);
    }
    saveGame();
    updateUI();
  }
